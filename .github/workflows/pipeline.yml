name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-results:
    # The raw data can't be redistributed, so CI checks the committed outputs instead of rebuilding them
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pinned packages
        run: pip install -r requirements-lock.txt

      - name: Unit and output-contract tests
        run: python -m pytest -q

      - name: Regenerate results from the committed outputs
        run: python src/report.py

      - name: Compare results with the committed run
        # every reported number is in this generated file
        run: git diff --exit-code docs/results.md

      - uses: actions/upload-artifact@v7
        if: always() # keep the results for inspection when the comparison fails
        with:
          name: results
          path: docs/

  oldest-python:
    # README promises Python 3.10+ and pandas 2.x: newest packages that still support 3.10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install packages
        run: pip install -r requirements.txt pytest

      - name: Unit and output-contract tests
        run: python -m pytest -q

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the full history
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
